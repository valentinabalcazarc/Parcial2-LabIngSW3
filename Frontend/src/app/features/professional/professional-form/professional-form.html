<app-card padding="lg">
  <form
    class="form"
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    novalidate
    aria-label="Formulario de médico"
  >
    <div class="form__grid">
      <app-form-field
        label="Cédula"
        inputId="professional-cedula"
        required
        [control]="form.controls.cedula"
        [messages]="cedulaMessages"
      >
        <app-input-text
          inputId="professional-cedula"
          formControlName="cedula"
          autocomplete="off"
          describedBy="professional-cedula-error"
          [invalid]="invalid(form.controls.cedula)"
        />
      </app-form-field>

      <app-form-field
        label="Nombre"
        inputId="professional-nombre"
        required
        [control]="form.controls.nombre"
        [messages]="nombreMessages"
      >
        <app-input-text
          inputId="professional-nombre"
          formControlName="nombre"
          autocomplete="given-name"
          describedBy="professional-nombre-error"
          [invalid]="invalid(form.controls.nombre)"
        />
      </app-form-field>

      <app-form-field
        label="Apellido"
        inputId="professional-apellido"
        required
        [control]="form.controls.apellido"
        [messages]="apellidoMessages"
      >
        <app-input-text
          inputId="professional-apellido"
          formControlName="apellido"
          autocomplete="family-name"
          describedBy="professional-apellido-error"
          [invalid]="invalid(form.controls.apellido)"
        />
      </app-form-field>

      <app-form-field
        label="Tipo de profesional"
        inputId="professional-tipo"
        required
        [control]="form.controls.tipo"
        [messages]="tipoMessages"
      >
        <app-select
          inputId="professional-tipo"
          formControlName="tipo"
          placeholder="Seleccione el tipo"
          describedBy="professional-tipo-error"
          [options]="types()"
          [invalid]="invalid(form.controls.tipo)"
        />
      </app-form-field>

      <app-form-field
        label="Correo electrónico"
        inputId="professional-email"
        required
        [control]="form.controls.email"
        [messages]="emailMessages"
      >
        <app-input-text
          inputId="professional-email"
          type="email"
          formControlName="email"
          autocomplete="email"
          describedBy="professional-email-error"
          [invalid]="invalid(form.controls.email)"
        />
      </app-form-field>

      <app-form-field
        label="Contraseña inicial"
        inputId="professional-password"
        required
        hint="El médico la usará para iniciar sesión."
        [control]="form.controls.password"
        [messages]="passwordMessages"
      >
        <app-input-text
          inputId="professional-password"
          type="password"
          formControlName="password"
          autocomplete="new-password"
          describedBy="professional-password-hint professional-password-error"
          [invalid]="invalid(form.controls.password)"
        />
      </app-form-field>
    </div>

    @if (errorMessage()) {
      <app-form-error>{{ errorMessage() }}</app-form-error>
    }

    <div class="form__actions">
      <app-button
        type="button"
        color="secondary"
        label="Cancelar"
        [disabled]="loading()"
        (click)="cancelled.emit()"
      />
      <app-button
        type="submit"
        [label]="submitLabel()"
        [loading]="loading()"
        [disabled]="!canSubmit()"
      />
    </div>
  </form>
</app-card>
