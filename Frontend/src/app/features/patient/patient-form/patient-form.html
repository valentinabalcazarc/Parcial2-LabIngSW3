<app-card padding="lg">
  <form
    class="form"
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    novalidate
    aria-label="Formulario de paciente"
  >
    <div class="form__grid">
      <app-form-field
        label="Cédula"
        inputId="patient-cedula"
        required
        [control]="form.controls.cedula"
        [messages]="cedulaMessages"
      >
        <app-input-text
          inputId="patient-cedula"
          formControlName="cedula"
          autocomplete="off"
          describedBy="patient-cedula-error"
          [invalid]="invalid(form.controls.cedula)"
        />
      </app-form-field>

      <app-form-field
        label="Nombre"
        inputId="patient-nombre"
        required
        [control]="form.controls.nombre"
        [messages]="nombreMessages"
      >
        <app-input-text
          inputId="patient-nombre"
          formControlName="nombre"
          autocomplete="given-name"
          describedBy="patient-nombre-error"
          [invalid]="invalid(form.controls.nombre)"
        />
      </app-form-field>

      <app-form-field
        label="Apellido"
        inputId="patient-apellido"
        required
        [control]="form.controls.apellido"
        [messages]="apellidoMessages"
      >
        <app-input-text
          inputId="patient-apellido"
          formControlName="apellido"
          autocomplete="family-name"
          describedBy="patient-apellido-error"
          [invalid]="invalid(form.controls.apellido)"
        />
      </app-form-field>

      <app-form-field
        label="Fecha de nacimiento"
        inputId="patient-nacimiento"
        required
        [control]="form.controls.fechaNac"
        [messages]="nacimientoMessages"
      >
        <app-input-text
          inputId="patient-nacimiento"
          type="date"
          formControlName="fechaNac"
          autocomplete="bday"
          describedBy="patient-nacimiento-error"
          [invalid]="invalid(form.controls.fechaNac)"
        />
      </app-form-field>

      <app-form-field
        label="Correo electrónico"
        inputId="patient-email"
        required
        [control]="form.controls.email"
        [messages]="emailMessages"
      >
        <app-input-text
          inputId="patient-email"
          type="email"
          formControlName="email"
          autocomplete="email"
          describedBy="patient-email-error"
          [invalid]="invalid(form.controls.email)"
        />
      </app-form-field>

      <app-form-field
        label="Contraseña inicial"
        inputId="patient-password"
        required
        hint="El paciente la usará para iniciar sesión."
        [control]="form.controls.password"
        [messages]="passwordMessages"
      >
        <app-input-text
          inputId="patient-password"
          type="password"
          formControlName="password"
          autocomplete="new-password"
          describedBy="patient-password-hint patient-password-error"
          [invalid]="invalid(form.controls.password)"
        />
      </app-form-field>
    </div>

    @if (errorMessage()) {
      <app-form-error>{{ errorMessage() }}</app-form-error>
    }

    <div class="form__actions">
      <app-button
        type="button"
        color="secondary"
        label="Cancelar"
        [disabled]="loading()"
        (click)="cancelled.emit()"
      />
      <app-button
        type="submit"
        [label]="submitLabel()"
        [loading]="loading()"
        [disabled]="!canSubmit()"
      />
    </div>
  </form>
</app-card>
