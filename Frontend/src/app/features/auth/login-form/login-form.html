<form class="form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate aria-label="Inicio de sesión">
  <app-form-field
    label="Cédula"
    inputId="login-cedula"
    required
    [control]="form.controls.cedula"
    [messages]="cedulaMessages"
  >
    <app-input-text
      inputId="login-cedula"
      type="text"
      formControlName="cedula"
      autocomplete="username"
      describedBy="login-cedula-error"
      [invalid]="invalid(form.controls.cedula)"
    />
  </app-form-field>

  <app-form-field
    label="Contraseña"
    inputId="login-password"
    required
    [control]="form.controls.password"
    [messages]="passwordMessages"
  >
    <app-input-text
      inputId="login-password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
      describedBy="login-password-error"
      [invalid]="invalid(form.controls.password)"
    />
  </app-form-field>

  @if (errorMessage()) {
    <app-form-error>{{ errorMessage() }}</app-form-error>
  }

  <app-button
    type="submit"
    label="Iniciar sesión"
    [fullWidth]="true"
    [loading]="loading()"
    [disabled]="!canSubmit()"
  />
</form>
