<app-table-with-title
  [title]="heading()"
  [columns]="columns()"
  [rows]="appointments()"
  [loading]="loading()"
  [emptyMessage]="emptyMessage()"
>
  @if (creatable()) {
    <app-button slot="actions" type="button" label="Nueva cita" (click)="create.emit()" />
  }

  <ng-template appTableCell="tipo" let-row>
    @if (row.profesional?.tipo) {
      <app-badge>{{ typeLabel(row.profesional.tipo) }}</app-badge>
    } @else {
      —
    }
  </ng-template>
</app-table-with-title>
