<header class="page-header">
  <div class="page-header__text">
    <app-heading [level]="1">{{ title() }}</app-heading>
    @if (description()) {
      <p class="page-header__description">{{ description() }}</p>
    }
  </div>
  <div class="page-header__actions">
    <ng-content select="[slot=actions]" />
  </div>
</header>
