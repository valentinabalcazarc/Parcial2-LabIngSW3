<app-main-layout [user]="user()" (login)="goLogin()" (logout)="logout()">
  <div class="page">
    <app-page-header title="Citas médicas" description="Citas de todos los pacientes de la clínica.">
      <app-button slot="actions" type="button" [fullWidth]="true" (click)="go('/admin/citas/nueva')">
        <app-icon name="calendar-plus" [size]="18" />
        Nueva cita
      </app-button>
    </app-page-header>

    @if (list.error()) {
      <app-form-error>{{ list.error() }}</app-form-error>
    }

    <app-appointment-list
      showPatient
      title="Todas las citas"
      [appointments]="list.items()"
      [loading]="list.loading()"
    />
  </div>
</app-main-layout>
