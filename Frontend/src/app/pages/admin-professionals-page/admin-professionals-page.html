<app-main-layout [user]="user()" (login)="goLogin()" (logout)="logout()">
  <div class="page">
    <app-page-header title="Médicos" description="Profesionales registrados en la clínica.">
      <app-button slot="actions" type="button" [fullWidth]="true" (click)="go('/admin/medicos/nuevo')">
        <app-icon name="plus" [size]="18" />
        Nuevo médico
      </app-button>
    </app-page-header>

    @if (list.error()) {
      <app-form-error>{{ list.error() }}</app-form-error>
    }

    <app-professional-list
      variant="admin"
      title="Listado de médicos"
      [professionals]="list.items()"
      [loading]="list.loading()"
    />
  </div>
</app-main-layout>
